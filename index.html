<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="Jira Dashboard layout" />

		<link
			rel="preconnect"
			href="https://fonts.googleapis.com" />
		<link
			rel="preconnect"
			href="https://fonts.gstatic.com"
			crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap"
			rel="stylesheet" />

		<title>Jira Dashboard</title>

		<link
			rel="stylesheet"
			href="./style.css" />
		<link
			rel="stylesheet"
			href="./modal.css" />

		<link
			rel="icon"
			type="image/x-icon"
			href="assets/jira_favicon.png" />
	</head>

	<body>
		<div class="app">
			<header class="header">
				<section class="header__left">
					<label
						class="header__app-switcher"
						title="Navigation Toggle Menu"
						aria-label="Navigation Toggle Menu">
						<svg class="icon--medium">
							<use href="./assets/ui-icon-sprite.svg#app-switcher"></use>
						</svg>

						<input
							type="checkbox"
							class="hidden"
							id="nav-toggle" />
					</label>

					<div class="header__logo">
						<img
							src="./assets/jira_logo_text.png"
							alt="Jira Logo" />
					</div>
					<button class="header__link--hidden hidden">
						<span>Projects</span>
						<svg class="icon--small">
							<use href="./assets/ui-icon-sprite.svg#chevron-down"></use>
						</svg>
					</button>

					<nav
						class="header__nav"
						title="Main Navigation"
						aria-label="Main Navigation">
						<ul class="header__list">
							<li class="header__item">
								<button class="header__link">
									<span>Your work</span>
									<svg class="icon--small">
										<use
											href="./assets/ui-icon-sprite.svg#chevron-down"></use>
									</svg>

									<svg class="icon--small hidden">
										<use
											href="./assets/ui-icon-sprite.svg#forward"></use>
									</svg>
								</button>
							</li>

							<li class="header__item header__item--active">
								<button class="header__link">
									<span>Projects</span>
									<svg class="icon--small">
										<use
											href="./assets/ui-icon-sprite.svg#chevron-down"></use>
									</svg>

									<svg class="icon--small hidden">
										<use
											href="./assets/ui-icon-sprite.svg#forward"></use>
									</svg>
								</button>
							</li>

							<li class="header__item">
								<button class="header__link">
									<span>Filters</span>
									<svg class="icon--small">
										<use
											href="./assets/ui-icon-sprite.svg#chevron-down"></use>
									</svg>

									<svg class="icon--small hidden">
										<use
											href="./assets/ui-icon-sprite.svg#forward"></use>
									</svg>
								</button>
							</li>

							<li class="header__item">
								<button class="header__link">
									<span>Dashboards</span>
									<svg class="icon--small">
										<use
											href="./assets/ui-icon-sprite.svg#chevron-down"></use>
									</svg>

									<svg class="icon--small hidden">
										<use
											href="./assets/ui-icon-sprite.svg#forward"></use>
									</svg>
								</button>
							</li>

							<li class="header__item">
								<button class="header__link">
									<span>Teams</span>
									<svg class="icon--small">
										<use
											href="./assets/ui-icon-sprite.svg#chevron-down"></use>
									</svg>

									<svg class="icon--small hidden">
										<use
											href="./assets/ui-icon-sprite.svg#forward"></use>
									</svg>
								</button>
							</li>

							<li class="header__item">
								<button class="header__link">
									<span>Plans</span>
									<svg class="icon--small">
										<use
											href="./assets/ui-icon-sprite.svg#chevron-down"></use>
									</svg>

									<svg class="icon--small hidden">
										<use
											href="./assets/ui-icon-sprite.svg#forward"></use>
									</svg>
								</button>
							</li>

							<li class="header__item">
								<button class="header__link">
									<span>Apps</span>
									<svg class="icon--small">
										<use
											href="./assets/ui-icon-sprite.svg#chevron-down"></use>
									</svg>

									<svg class="icon--small hidden">
										<use
											href="./assets/ui-icon-sprite.svg#forward"></use>
									</svg>
								</button>
							</li>
						</ul>
					</nav>

					<button class="header__button header__create-button btn--primary">
						Create
					</button>
				</section>

				<section class="header__right">
					<label
						class="header__menu-btn hidden"
						title="Profile Toggle Menu"
						aria-label="Profile Toggle Menu">
						<svg class="icon--medium">
							<use href="./assets/ui-icon-sprite.svg#menu"></use>
						</svg>

						<input
							type="checkbox"
							class="hidden"
							id="menu-toggle" />
					</label>

					<div>
						<div class="header__search">
							<input
								name="search-task"
								type="text"
								class="search-bar header__search-bar"
								placeholder="Search by Title" />

							<svg class="header__search-icon">
								<use href="./assets/ui-icon-sprite.svg#search"></use>
							</svg>
						</div>

						<div class="board__search">
							<input
								name="search-member"
								type="text"
								placeholder="Enter Name"
								class="search-bar board__search-bar" />

							<svg class="board__search-icon">
								<use href="./assets/ui-icon-sprite.svg#search"></use>
							</svg>
						</div>

						<div class="header__actions">
							<button
								class="header__icon-btn header__icon-btn--notifications"
								title="Notifications"
								aria-label="Notifications">
								<svg class="icon--medium">
									<use href="./assets/ui-icon-sprite.svg#bell"></use>
								</svg>
							</button>

							<button
								class="header__icon-btn header__icon-btn--help"
								title="Help"
								aria-label="Help">
								<svg class="icon--medium">
									<use
										href="./assets/ui-icon-sprite.svg#question"></use>
								</svg>
							</button>

							<button
								class="header__icon-btn header__icon-btn--settings"
								title="Settings"
								aria-label="Settings">
								<svg class="icon--medium">
									<use href="./assets/ui-icon-sprite.svg#setting"></use>
								</svg>
							</button>

							<div class="header__profile">
								<img
									src="https://i2-prod.mirror.co.uk/incoming/article5614456.ece/ALTERNATES/s1227b/PAY-Lee-Griggs.jpg"
									alt="Himanshu Sorathiya"
									class="header__avatar" />
							</div>
						</div>
					</div>
				</section>
			</header>

			<aside class="sidebar">
				<section class="sidebar__project-header">
					<div class="sidebar__project-logo-container">
						<img
							src="./assets/beyond_gravity_logo.png"
							alt="Beyond Gravity Logo"
							class="sidebar__project-logo" />
					</div>

					<div class="sidebar__project-info">
						<h1 class="sidebar__project-name">Beyond Gravity</h1>

						<span class="sidebar__project-type">Software project</span>
					</div>
				</section>

				<nav class="sidebar__nav">
					<h2 class="sidebar__heading">PLANNING</h2>

					<ul class="sidebar__list">
						<li class="sidebar__item">
							<button
								title="Roadmap"
								class="sidebar__link">
								<svg class="icon--medium">
									<use href="./assets/ui-icon-sprite.svg#roadmap"></use>
								</svg>
								<span>Roadmap</span>
							</button>
						</li>

						<li class="sidebar__item">
							<button
								title="Backlog"
								class="sidebar__link">
								<svg class="icon--medium">
									<use href="./assets/ui-icon-sprite.svg#backlog"></use>
								</svg>
								<span>Backlog</span>
							</button>
						</li>

						<li class="sidebar__item sidebar__item--active">
							<button
								title="Board"
								class="sidebar__link">
								<svg class="icon--medium">
									<use href="./assets/ui-icon-sprite.svg#board"></use>
								</svg>
								<span>Board</span>
							</button>
						</li>

						<li class="sidebar__item">
							<button
								title="buttoneports"
								class="sidebar__link">
								<svg class="icon--medium">
									<use
										href="./assets/ui-icon-sprite.svg#chart-up"></use>
								</svg>
								<span>Reports</span>
							</button>
						</li>

						<li class="sidebar__item">
							<button
								title="Issues"
								class="sidebar__link">
								<svg class="icon--medium">
									<use href="./assets/ui-icon-sprite.svg#issue"></use>
								</svg>
								<span>Issues</span>
							</button>
						</li>
					</ul>

					<h2 class="sidebar__heading">DEVELOPMENT</h2>

					<ul class="sidebar__list">
						<li class="sidebar__item">
							<button
								title="Code"
								class="sidebar__link">
								<svg class="icon--medium">
									<use href="./assets/ui-icon-sprite.svg#code"></use>
								</svg>
								<span>Code</span>
							</button>
						</li>

						<li class="sidebar__item">
							<button
								title="Security"
								class="sidebar__link">
								<svg class="icon--medium">
									<use
										href="./assets/ui-icon-sprite.svg#security"></use>
								</svg>
								<span>Security</span>
							</button>
						</li>

						<li class="sidebar__item">
							<button
								title="Release"
								class="sidebar__link">
								<svg class="icon--medium">
									<use href="./assets/ui-icon-sprite.svg#release"></use>
								</svg>
								<span>Release</span>
							</button>
						</li>
					</ul>
				</nav>

				<div class="sidebar__footer">
					<button
						title="Project Settings"
						class="sidebar__link">
						<svg class="icon--medium">
							<use href="./assets/ui-icon-sprite.svg#setting"></use>
						</svg>

						<span>Project settings</span>
					</button>
				</div>
			</aside>

			<main class="main">
				<p class="main-board__breadcrumb">Projects / Beyond Gravity</p>

				<header class="main-board__header">
					<h1 class="main-board__title">Board</h1>

					<div class="main-board__header-actions">
						<button
							title="Favorites"
							class="main-board__icon-btn main-board__icon-btn--star">
							<svg class="icon--medium">
								<use href="./assets/ui-icon-sprite.svg#star"></use>
							</svg>
						</button>

						<button
							title="More Actions"
							class="main-board__icon-btn main-board__icon-btn--menu subtle-gray-bg">
							<svg class="icon--medium">
								<use href="./assets/ui-icon-sprite.svg#actions"></use>
							</svg>
						</button>
					</div>
				</header>

				<section class="main-board__controls">
					<div class="main-board__controls-left">
						<div class="board__search">
							<input
								name="search-member"
								type="text"
								placeholder="Enter Name"
								class="search-bar board__search-bar" />

							<svg class="board__search-icon">
								<use href="./assets/ui-icon-sprite.svg#search"></use>
							</svg>
						</div>

						<div class="main-board__avatars"></div>
					</div>

					<div class="main-board__controls-middle">
						<div class="main-board__dropdown-container">
							<label
								for="sort"
								class="main-board__dropdown-label"
								>Sort By</label
							>

							<select
								id="sort"
								class="main-board__dropdown main-board__dropdown--sort subtle-gray-bg">
								<option value="">None</option>
							</select>
						</div>

						<div class="main-board__dropdown-container">
							<label
								for="group"
								class="main-board__dropdown-label"
								>Group By</label
							>

							<select
								id="group"
								class="main-board__dropdown main-board__dropdown--group subtle-gray-bg">
								<option value="">None</option>
							</select>
						</div>
					</div>

					<div class="main-board__controls-right">
						<div class="main-board__dropdown-container">
							<label
								for="filter_tag"
								class="main-board__dropdown-label"
								>Filter by Tag</label
							>

							<select
								id="filter_tag"
								class="main-board__dropdown main-board__dropdown--tag subtle-gray-bg">
								<option value="">None</option>
							</select>
						</div>

						<div class="main-board__dropdown-container">
							<label
								for="filter_priority"
								class="main-board__dropdown-label"
								>Filter by Priority</label
							>

							<select
								id="filter_priority"
								class="main-board__dropdown main-board__dropdown--priority subtle-gray-bg">
								<option value="">None</option>
							</select>
						</div>
					</div>
				</section>

				<section class="main-board__grid">
					<div
						class="board-column"
						data-key="to-do">
						<header class="board-column__header">
							<span class="board-column__name"></span>

							<span class="board-column__task-count"></span>
						</header>

						<div class="board-column__content"><ul></ul></div>
					</div>

					<div
						class="board-column"
						data-key="in-progress">
						<header class="board-column__header">
							<span class="board-column__name"></span>

							<span class="board-column__task-count"></span>
						</header>

						<div class="board-column__content"><ul></ul></div>
					</div>

					<div
						class="board-column"
						data-key="in-review">
						<header class="board-column__header">
							<span class="board-column__name"></span>

							<span class="board-column__task-count"></span>
						</header>

						<div class="board-column__content"><ul></ul></div>
					</div>

					<div
						class="board-column"
						data-key="done">
						<header class="board-column__header">
							<span class="board-column__name"></span>

							<span class="board-column__task-count"></span>
						</header>

						<div class="board-column__content"><ul></ul></div>
					</div>
				</section>
			</main>
		</div>

		<div
			class="modal-container"
			data-view="">
			<div class="modal">
				<div class="modal-header">
					<h2></h2>

					<span class="modal-close-btn">
						<svg class="icon--medium">
							<use href="./assets/ui-icon-sprite.svg#close"></use>
						</svg>
					</span>
				</div>

				<article class="modal-task"></article>

				<form class="modal-form">
					<div class="form-group">
						<input
							type="text"
							id="task-id"
							name="id"
							hidden
							required />
					</div>

					<div class="form-group">
						<label for="task-name">Name</label>

						<input
							type="text"
							id="task-name"
							name="name"
							placeholder="Enter person name"
							required />
					</div>

					<div class="form-group">
						<label for="task-title">Title</label>

						<input
							type="text"
							id="task-title"
							name="title"
							placeholder="Enter task title"
							required />
					</div>

					<div class="form-group">
						<label for="task-description">Description</label>

						<input
							type="text"
							id="task-description"
							name="description"
							placeholder="Enter task description"
							required />
					</div>

					<div class="form-group">
						<label for="task-dueDate">Due Date</label>

						<input
							type="text"
							id="task-dueDate"
							name="dueDate"
							placeholder="Enter task Due Date"
							required />
					</div>

					<div class="form-group">
						<label for="task-reporting">Reporting</label>

						<input
							type="text"
							id="task-reporting"
							name="reporting"
							placeholder="Enter task reporting"
							required />
					</div>

					<div class="form-group">
						<label for="task-tag">Tag</label>

						<select
							id="task-tag"
							name="tag"
							required>
							<option value="">Select tag</option>
						</select>
					</div>

					<div class="form-group">
						<label for="task-status">Status</label>

						<select
							id="task-status"
							name="status"
							required>
							<option value="">Select status</option>
							<option value="to-do">To Do</option>
							<option value="in-progress">In Progress</option>
							<option value="in-review">In Review</option>
							<option value="done">Done</option>
						</select>
					</div>

					<div class="form-group">
						<label for="task-priority">Priority</label>

						<select
							id="task-priority"
							name="priority"
							required>
							<option value="">Select priority</option>
							<option value="low">Low</option>
							<option value="medium">Medium</option>
							<option value="high">High</option>
						</select>
					</div>

					<div class="form-actions">
						<button
							type="button"
							class="cancel-btn">
							Cancel
						</button>

						<button
							type="submit"
							class="submit-btn"></button>
					</div>
				</form>

				<div class="modal-actions">
					<button class="edit-btn">Edit Task</button>

					<button class="delete-btn">Delete Task</button>
				</div>
			</div>
		</div>

		<script
			defer
			src="js/script.js"
			type="module"></script>

		<script
			defer
			src="js/modules/modal.js"
			type="module"></script>

		<script
			defer
			src="js/handlers/filterAndOrderHandlers.js"
			type="module"></script>

		<script
			defer
			src="js/handlers/modalHandlers.js"
			type="module"></script>

		<script
			defer
			src="js/handlers/routingHandlers.js"
			type="module"></script>
	</body>
</html>
